name: CI
on:
  pull_request:
  push:
    branches: [main]
    # The archive bot only rewrites the story file twice a day; that alone needs no rebuild.
    paths-ignore: ['data/editions.json']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # The Vercel build, called directly so CI doesn't depend on what `npm run build` points at.
      - run: npx next build --webpack
      - run: npm run test:build
      - run: npm audit --omit=dev --audit-level=high
